[package]
name = "setfork-core"
version = "0.1.0"
edition = "2024"
description = "SetFork git-core service (Gitaly-style): serves proto/git.proto over gRPC/Connect."
# Проприетарный код SetFork — не публикуется в crates.io (cargo-deny: private ignore).
publish = false

[[bin]]
name = "setfork-core"
path = "src/main.rs"

[dependencies]
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tower = "0.5"
futures-util = "0.3"
http = "1"
prost = "0.14"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
# libgit2 без сетевых фич (нам нужны только локальные объекты/деревья/коммиты/рефы).
git2 = { version = "0.21", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
tonic-reflection = "0.14.6"
aes-gcm = "0.11.0"
sha2 = "0.11.0"
base64 = "0.23.0"
# HTTP-клиент для обратного вызова ядро→приложение (ADR-0015, gate.rs). Новых
# крейтов в дерево НЕ добавляет: hyper/hyper-util/http-body-util/bytes уже пришли
# транзитивно с tonic — здесь они просто объявлены прямыми, чтобы ими пользоваться.
# Только http1 и plaintext: вызов идёт внутри docker-сети, TLS там не нужен.
hyper = { version = "1", features = ["client", "http1"] }
# Валидация канона по ОПУБЛИКОВАННОЙ схеме list.v1.json (git::canon): правила
# формата берутся из схемы, а не переписываются условиями в коде. Раньше крейт
# стоял только в dev-зависимостях — им проверялись тесты того же файла.
jsonschema = { version = "0.49.2", default-features = false }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
http-body-util = "0.1"
bytes = "1"

[build-dependencies]
tonic-prost-build = "0.14"
# Чистый Rust protobuf-компилятор — protoc-бинарь не нужен ни в системе, ни vendored.
protox = "0.9"
prost = "0.14"

[dev-dependencies]

