[package]
name = "setfork-core"
version = "0.1.0"
edition = "2024"
description = "SetFork git-core service (Gitaly-style): serves proto/git.proto over gRPC/Connect."
# Лицензия объявлена ПОЛЕМ, а не только файлом LICENSE: инструменты (cargo-deny,
# аудит зависимостей, генераторы SBOM) читают метаданные, а не файл рядом. Поля не
# было вовсе, хотя AGPL лежал в корне с самого начала — то есть машина считала пакет
# без лицензии, а человек видел AGPL.
license = "AGPL-3.0-only"
# Не публикуется в crates.io: это сервис, а не библиотека (cargo-deny: private ignore).
# Открытость исходников и публикация в реестр — разные вещи.
publish = false

[[bin]]
name = "setfork-core"
path = "src/main.rs"

[dependencies]
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tower = "0.5"
futures-util = "0.3"
http = "1"
prost = "0.14"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
# libgit2 без сетевых фич (нам нужны только локальные объекты/деревья/коммиты/рефы).
git2 = { version = "0.21", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
tonic-reflection = "0.14.6"
aes-gcm = "0.11.0"
sha2 = "0.11.0"
base64 = "0.23.0"
# HTTP-клиент для обратного вызова ядро→приложение (ADR-0015, gate.rs). Новых
# крейтов в дерево НЕ добавляет: hyper/hyper-util/http-body-util/bytes уже пришли
# транзитивно с tonic — здесь они просто объявлены прямыми, чтобы ими пользоваться.
# Только http1 и plaintext: вызов идёт внутри docker-сети, TLS там не нужен.
hyper = { version = "1", features = ["client", "http1"] }
# Валидация канона по ОПУБЛИКОВАННОЙ схеме list.v1.json (git::canon): правила
# формата берутся из схемы, а не переписываются условиями в коде. Раньше крейт
# стоял только в dev-зависимостях — им проверялись тесты того же файла.
jsonschema = { version = "0.49.2", default-features = false }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
http-body-util = "0.1"
bytes = "1"

[features]
# Пробы линз проверки (tests/*_probe.rs). ВЫКЛЮЧЕНЫ по умолчанию намеренно: CI гоняет
# `cargo test -- --include-ignored`, а он выполняет и #[ignore] — то есть карантин через
# один лишь атрибут не работает. Часть проб требует поднятого сервера, часть падает по делу
# (документирует найденный дефект), и обе категории валили бы интеграционную джобу.
#   запуск: cargo test --features probes -- --include-ignored --test-threads=1 --nocapture
#
# ⚠️ `--nocapture` в рецепте НЕ УКРАШЕНИЕ. Пробы, которым нужен поднятый сервер
# (`ratelimit_probe`), при его отсутствии НЕ ПАДАЮТ — это осознанно, иначе общий прогон
# краснеет не по делу, а на такую красноту перестают смотреть. Но пропуск они печатают в
# stderr, а `cargo test` его прячет: без `--nocapture` такая проба выглядит как ЗЕЛЁНАЯ,
# ничего не проверив.
#
# Обжёгся на этом 27.08: прогнал все пробы без `--nocapture`, увидел «26 passed» и заключил,
# что карантин можно снимать — часть из этих «passed» не выполнила ни одного утверждения.
# ЗЕЛЁНЫЙ ОБЩИЙ ПРОГОН ПРОБ НИЧЕГО НЕ ДОКАЗЫВАЕТ про те из них, что требуют окружения.
probes = []

[build-dependencies]
tonic-prost-build = "0.14"
# Чистый Rust protobuf-компилятор — protoc-бинарь не нужен ни в системе, ни vendored.
protox = "0.9"
prost = "0.14"

[dev-dependencies]

