[package]
name = "setfork-core"
version = "0.1.0"
edition = "2021"
description = "SetFork git-core service (Gitaly-style): serves proto/git.proto over gRPC/Connect."

[[bin]]
name = "setfork-core"
path = "src/main.rs"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"
