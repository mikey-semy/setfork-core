# Деплой git-ядра в Dokploy (standalone). Живёт в общей сети dokploy-network;
# Postgres и том git-объектов — общие с фронтом (setfork-frontend).
# .env: DATABASE_URL (на общий db по имени сервиса в dokploy-network), GIT_DATA_DIR=/data/git.
# Порты наружу НЕ публикуем — gRPC только внутри сети (фронт зовёт core:50051).
services:
  core:
    build: { context: ., target: runtime }
    container_name: setfork-core
    restart: always
    env_file: .env
    environment:
      SETFORK_CORE_ADDR: 0.0.0.0:50051
      GIT_DATA_DIR: /data/git
      # Auth канала Next↔ядро: тот же токен задать фронту. ОБЯЗАТЕЛЕН — без него ядро
      # не стартует (fail-closed). `:?` роняет compose, если токен не задан в окружении.
      SETFORK_CORE_TOKEN: ${SETFORK_CORE_TOKEN:?SETFORK_CORE_TOKEN обязателен (тот же токен — фронту; openssl rand -hex 32)}
      # Rate-limit RPC: обычные/тяжёлые методы, запросов в минуту (0 = выкл).
      SETFORK_RPC_RPM: ${SETFORK_RPC_RPM:-600}
      SETFORK_RPC_RPM_HEAVY: ${SETFORK_RPC_RPM_HEAVY:-60}
      # URL опубликованной JSON Schema манифеста ($schema в каждом list.json, Ф2a).
      # От инстанса: RU-прод ссылается на себя — чужой домен дал бы молча не
      # работающее автодополнение из-за шейпинга. Файл раздаёт фронт (public/schema).
      SETFORK_SCHEMA_URL: ${SETFORK_SCHEMA_URL:-https://setfork.ru/schema/list.v1.json}
      # Ф3: общий с фронтом секрет расшифровки токена зеркала (пусто = зеркала
      # выключены, пуш честно запишет ошибку в статус настроек).
      SETFORK_MIRROR_SECRET: ${SETFORK_MIRROR_SECRET:-}
      # ADR-0015: адрес приложения для вопроса «можно ли писать в этот список».
      # ОБЯЗАТЕЛЕН как и токен: без него заморозка и архив перестают действовать на
      # git-путях, поэтому ядро не стартует. Имя сервиса фронта в dokploy-сети.
      SETFORK_APP_URL: ${SETFORK_APP_URL:?SETFORK_APP_URL обязателен (адрес приложения, напр. http://setfork-app:3000)}
    volumes:
      - setfork_git:/data/git
    networks: [dokploy-network]
    # Лимиты: защита соседей по VPS от разгона ядра (git-операции прожорливы).
    # Это cap, не резервирование; при упоре в лимит растёт латентность, не OOM соседей.
    mem_limit: 768m
    cpus: 2

  # Бэкап git-объектов → S3 (offsite). git = источник правды по контенту списков,
  # единственный хост → том обязан бэкапиться вне его. Ежедневный tar тома в объектный
  # S3, ротация BACKUP_KEEP_DAYS. Пусто BACKUP_S3_* → бэкапа НЕ будет (см. .env.example).
  # ⚠️ После деплоя проверь лог git-backup, объект в бакете и тестовый restore.
  #    Runbook: setfork-docs/internal/runbooks/backups.md
  git-backup:
    image: offen/docker-volume-backup:v2
    restart: always
    environment:
      BACKUP_CRON_EXPRESSION: ${BACKUP_GIT_CRON:-30 3 * * *}
      BACKUP_FILENAME: setfork-git-%Y%m%dT%H%M%S.tar.gz
      BACKUP_PRUNING_PREFIX: setfork-git-
      BACKUP_RETENTION_DAYS: ${BACKUP_KEEP_DAYS:-14}
      AWS_ENDPOINT: ${BACKUP_S3_ENDPOINT_HOST:-} # FQDN БЕЗ схемы (s3.ru-3.storage.selcloud.ru)
      AWS_ENDPOINT_PROTO: ${BACKUP_S3_ENDPOINT_PROTO:-https}
      AWS_S3_BUCKET_NAME: ${BACKUP_S3_BUCKET:-}
      AWS_S3_PATH: ${BACKUP_S3_GIT_PREFIX:-setfork/git}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
      # Алерт о сбое бэкапа (shoutrrr-URL, напр. telegram://token@telegram?chats=id).
      # Пусто — молчим; тогда сбой виден только в логах контейнера (хуже).
      NOTIFICATION_URLS: ${BACKUP_NOTIFY_URLS:-}
      NOTIFICATION_LEVEL: ${BACKUP_NOTIFY_LEVEL:-error}
    volumes:
      - setfork_git:/backup/setfork-git:ro
    networks: [dokploy-network]
    mem_limit: 256m
    cpus: 1

volumes:
  setfork_git:

networks:
  dokploy-network:
    external: true
