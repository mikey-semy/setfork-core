# Конфиг zizmor — статического аудита САМИХ воркфлоу (не кода). Гоняется джобой
# `workflows` в audit.yml; локально: `zizmor --offline .` из корня репозитория.
#
# Закрепление экшенов (audit unpinned-uses). По умолчанию zizmor требует хеш для
# всего подряд; мы разделяем по владельцу:
#
#   *          → hash-pin. Стороннему автору ничто не мешает переставить свой тег
#                или ветку на другой коммит — а наш раннер не одноразовая песочница
#                GitHub: у него проброшен docker.sock ХОСТА и лежит ключ выкатки на
#                прод. Подменённый экшен получает и то, и другое. Хеш — единственная
#                ссылка, которую автор задним числом не поменяет. Показательно:
#                `rustsec/audit-check@v2` у нас стоял веткой, а не тегом — то есть
#                выполнялось то, что автор туда положит завтра.
#
#   actions/*  → ref-pin. Первая сторона GitHub, теги релизов там не переставляют
#                на чужой код; требовать хеш ещё и от checkout/setup-node — это
#                обновлять четыре SHA руками за нулевую прибавку к защите.
#                Если захочется строже, поменять на hash-pin — одно слово.
rules:
  unpinned-uses:
    config:
      policies:
        actions/*: ref-pin
        '*': hash-pin
