name: CI

# CI на СВОЁМ раннере (setfork-ci-runner, runs-on: [self-hosted, setfork-core]) —
# GitHub-минуты не тратятся (решение владельца 2026-07-14/20). Основной гейт перед
# мержем всё равно ЛОКАЛЬНЫЙ scripts/ci-local.sh; это дублирующий барьер в UI.
# Специфика контейнерного раннера (myoung34/github-runner + docker.sock):
# rust-джобы идут в container: rust:1-trixie (не ставим toolchain на раннер),
# services доступны по ИМЕНИ сервиса (не localhost — job сам в контейнере).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: [self-hosted, setfork-core]
    container: rust:1-trixie
    steps:
      - uses: actions/checkout@v4
      # rust-образ — minimal-профиль: rustfmt/clippy докачиваем компонентами.
      - run: rustup component add rustfmt clippy
      # protoc не нужен (protobuf компилирует protox в build.rs); libgit2 собирается через cc.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --verbose

  # Интеграционные + golden против настоящего Postgres — те же тесты,
  # что гоняет scripts/ci-local.sh на эфемерном контейнере.
  integration:
    runs-on: [self-hosted, setfork-core]
    container: rust:1-trixie
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: t
          POSTGRES_PASSWORD: t
          POSTGRES_DB: t
        options: >-
          --health-cmd "pg_isready -U t -d t"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -- --include-ignored
        env:
          # hostname = имя сервиса: job-контейнер в одной docker-сети с сервисом.
          TEST_DATABASE_URL: postgresql://t:t@postgres:5432/t

  # Публикация образа в GHCR (только push в master): ghcr.io/<repo>:latest + :sha.
  # Без buildx-экшена — на self-hosted хватает плоского docker build/push через сок.
  # Деплой в Dokploy пока собирает образ сам; переключение на pull из GHCR —
  # открытый вопрос трека (tracks/core.md).
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, setfork-core]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: docker build + push в GHCR
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build --target runtime -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
