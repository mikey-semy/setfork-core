name: CI

# CI на СВОЁМ раннере (setfork-ci-runner, runs-on: [self-hosted, setfork-core]) —
# GitHub-минуты не тратятся (решение владельца 2026-07-14/20). Основной гейт перед
# мержем всё равно ЛОКАЛЬНЫЙ scripts/ci-local.sh; это дублирующий барьер в UI.
#
# Специфика раннера-в-докере (myoung34/github-runner + docker.sock):
# `container:`/`services:`/docker-экшены НЕ работают — job-контейнеры монтируют
# пути раннера (externals /__e, workspace), которых нет у host-демона (sibling,
# не DinD). Поэтому все джобы «raw»: toolchain ставится rustup'ом на раннер,
# Postgres — sibling-контейнер, чья сеть подключается к контейнеру раннера
# (docker network connect $(hostname)), gitleaks — нативный бинарь.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Пол для всех джоб: без этой строки GITHUB_TOKEN приезжает с правами по
# умолчанию для репозитория (в том числе на запись) даже в джобы, которым нужен
# только исходник. Кому нужно больше — объявляет у себя и перекрывает
# (image, deploy, stuck ниже).
permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, setfork-core]
    steps:
      # persist-credentials: false — иначе checkout кладёт GITHUB_TOKEN в
      # .git/config рабочей копии, а раннер общий и переиспользуемый: токен
      # доживает до чужих шагов и уезжает в артефакты. Клон фронта ниже ходит
      # со своим url'ом, git-креды checkout'а не использует никто.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: toolchain (rustup + cc для libgit2)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential pkg-config
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --component rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # protoc не нужен (protobuf компилирует protox в build.rs); libgit2 собирается через cc.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # ПРОБЫ СОБИРАЮТСЯ. Они закрыты фичей `probes` (им нужен либо поднятый сервер,
      # либо долгий прогон), и потому годами могли не компилироваться: замер 25.08 —
      # девять файлов из одиннадцати не собирались с конца июля, контракт ушёл вперёд,
      # а узнать об этом было НЕОТКУДА. Проба, которая не компилируется, выглядит
      # покрытием и им не является. Сборки достаточно: запуск части из них требует
      # ручных условий, а гниют они именно на контракте.
      - run: cargo check --features probes --tests
      - run: cargo test --verbose
      # Сверка proto с копией во фронте. БЕЗ этого шага скрипт никто не звал, и его
      # «::warning:: проверка не выполнена» не появлялось нигде — гейт выглядел живым,
      # хотя не работал (замечание авто-ревью #55). Теперь отсутствие клона фронта
      # видно в аннотациях прогона, а расхождение контрактов — красит шаг.
      #
      # Клон фронта берём тем же токеном, если он задан секретом; без него шаг сам
      # печатает «НЕ ВЫПОЛНЕН» и не блокирует — кросс-репный чекаут приватного репо
      # без токена невозможен, и врать об этом гейт не должен.
      # ⚠️ Существующий клон ОБНОВЛЯЕМ, а не переиспользуем как есть. Раннеры
      # ephemeral, но их workdir — именованный том, переживающий пересоздание
      # контейнера: клон фронта может дожить до следующих прогонов и протухнуть.
      # Оба гейта ниже сверяются с `origin/master` фронта, поэтому устаревший клон
      # означает сверку со вчерашним состоянием — и в момент настоящего расхождения
      # они оба ответили бы «OK». Замечание авто-ревью на core#93 (P1).
      #
      # `fetch` идёт с url'ом в аргументе, а не через `remote set-url`: так токен не
      # оседает в `.git/config` на общем раннере.
      - name: Свежий клон фронта (для обоих кросс-репных гейтов)
        env:
          FRONTEND_TOKEN: ${{ secrets.FRONTEND_RO_TOKEN }}
        run: |
          if [ -z "${FRONTEND_TOKEN:-}" ]; then
            echo "::warning::FRONTEND_RO_TOKEN не задан — кросс-репные гейты не выполнятся"
            exit 0
          fi
          url="https://x-access-token:${FRONTEND_TOKEN}@github.com/mikey-semy/setfork-frontend.git"
          if [ -d ../setfork-frontend/.git ]; then
            git -C ../setfork-frontend fetch --quiet --depth 50 "$url" master:refs/remotes/origin/master \
              || echo "::warning::fetch фронта не удался — гейты сверятся с УСТАРЕВШИМ клоном"
          else
            git clone --quiet --depth 50 "$url" ../setfork-frontend \
              || echo "::warning::клон фронта не удался — кросс-репные гейты пропущены"
          fi

      - name: proto-sync (фронт)
        run: bash scripts/check-proto-sync.sh

      # Второй кросс-репный гейт на том же клоне: ядро и фронт обязаны выкатываться
      # на ОДИН хост. 04.08 канон сменился, у фронта цель поправили 09.08, у ядра
      # забыли — и оно пять суток каталось на списанный сервер, а нашла это линза,
      # случайно. Проверка того самого утверждения, которое было неверным всё это
      # время. R1 реестра 2026-08-11.
      - name: deploy-target (ядро и фронт на одном хосте)
        run: bash scripts/check-deploy-target.sh

  # Интеграционные + golden против настоящего Postgres — те же тесты,
  # что гоняет scripts/ci-local.sh на эфемерном контейнере.
  integration:
    runs-on: [self-hosted, setfork-core]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: toolchain (rustup + cc для libgit2)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential pkg-config
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Postgres (sibling-контейнер, сеть подключается к раннеру)
        run: |
          docker network create "ci-pg-${GITHUB_RUN_ID}" || true
          docker run -d --name "pg-${GITHUB_RUN_ID}" --network "ci-pg-${GITHUB_RUN_ID}" \
            -e POSTGRES_USER=t -e POSTGRES_PASSWORD=t -e POSTGRES_DB=t \
            pgvector/pgvector:pg16
          docker network connect "ci-pg-${GITHUB_RUN_ID}" "$(hostname)"
          # ⚠️ Ожидание С ВЕРДИКТОМ. Прежний цикл просто заканчивался после 60 попыток и
          # шаги шли дальше — а дальше тесты падали с PoolTimedOut, и причина читалась как
          # «сломались тесты», а не «база не поднялась». Молчаливое ожидание хуже его
          # отсутствия: оно ПОХОЖЕ на проверку (R8 линзы 08, тот же дефект был в ci-local).
          ready=0
          for _ in $(seq 1 60); do
            if docker exec "pg-${GITHUB_RUN_ID}" pg_isready -U t -d t >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Postgres не поднялся за 60 секунд — дальше идти нельзя"
            docker logs --tail 30 "pg-${GITHUB_RUN_ID}" || true
            exit 1
          fi
      - run: cargo test -- --include-ignored
        env:
          TEST_DATABASE_URL: postgresql://t:t@pg-${{ github.run_id }}:5432/t
      - name: cleanup Postgres
        if: always()
        run: |
          docker network disconnect "ci-pg-${GITHUB_RUN_ID}" "$(hostname)" || true
          docker rm -f "pg-${GITHUB_RUN_ID}" || true
          docker network rm "ci-pg-${GITHUB_RUN_ID}" || true

  # Сборка образа — на КАЖДОМ прогоне, публикация в GHCR — только с master.
  #
  # До 12.08 джоба целиком стояла за `if: push && master`, то есть единственная
  # проверка «код собирается локально, но не собирается в образе» была ЗА воротами.
  # Так #86 прошёл зелёным, а master после мержа три дня не собирался: в образ не
  # копировался `schema/` (core#87). Ни PR, ни master об этом не краснели — деплой
  # уходил `skipped` и молчал. У фронта сборка стережёт вход в master с самого
  # начала (`npm run build` в джобе `check`), у ядра — не стерегла. Линза 08, R11:
  # это корень, а не сам пропущенный COPY.
  #
  # Форма стандартная: `docker/build-push-action` ровно так и настраивают —
  # `push: ${{ github.event_name != 'pull_request' }}`. Здесь плоский docker
  # через сок (buildx-экшен на sibling-раннере не работает, см. шапку файла).
  image:
    runs-on: [self-hosted, setfork-core]
    # `packages: write` достаётся и PR-прогону — права задаются на джобе, не на шаге.
    # Разделять на две джобы смысла нет: репозиторий приватный, форков ноль, а PR-код
    # и так исполняется на раннере с доступом к docker.sock хоста, то есть модель
    # угроз от этой строки не меняется. Пушит всё равно только шаг ниже, с master.
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: docker build (тот же слой, что поедет на прод)
        run: docker build --target runtime -t "$IMAGE:${{ github.sha }}" .
      # Значения приходят переменными окружения, а не подстановкой ${{ }} внутрь
      # скрипта: подстановка склеивает текст ДО запуска шелла, и всё, что попало
      # в github.actor, исполняется как код. Логин у нас всё равно приходит от
      # GitHub, но правило одинаковое для всех run-блоков — иначе однажды в такую
      # строку подставят заголовок ветки.
      - name: push в GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          # Логин токеном прогона живёт минуты, а в ~/.docker/config.json раннера
          # оставался навсегда — и следующий прогон получал от ghcr.io «denied»
          # даже на публичный образ (так упал первый прогон джобы workflows).
          # У фронта logout стоял с самого начала.
          docker logout ghcr.io
      # Тег с PR-прогона на раннере не нужен: образы копятся и съедают диск
      # (13 брошенных CI-контейнеров и 27 ГБ worktree — уже было 12.08). Кэш
      # слоёв удаление тега не трогает, следующая сборка так же быстра.
      - name: Убрать образ PR-прогона
        if: always() && github.event_name == 'pull_request'
        run: docker image rm "$IMAGE:${{ github.sha }}" 2>/dev/null || true

  # ── Выкатка на прод ─────────────────────────────────────────────────────────
  #
  # ЗДЕСЬ, а не отдельным воркфлоу по `workflow_run`. Документация называет
  # назначение того события прямо: цепочка нужна, «when you need to perform
  # privileged actions in a subsequent workflow that the initial, less-privileged
  # workflow cannot access» — то есть когда CI идёт на непривилегированном
  # событии, прежде всего `pull_request` из форка. Репозиторий приватный, форков
  # ноль, CI гоняется на своих раннерах: этого случая у нас нет.
  #
  # Что ушло вместе с формой (всё это было написано 12.08 и было нужно ТОЛЬКО
  # из-за неё):
  #   • гейт «чей коммит выкатывать» с поиском прогона CI по вершине и правом
  #     `actions: read` — деплой идёт в прогоне СВОЕГО коммита;
  #   • тройная проверка провенанса (`event`, `head_repository`, `head_branch`) —
  #     форк-ветку можно назвать `master`, но сюда мы попадаем только по push
  #     в собственный master;
  #   • сверка вершины при снятии тревоги — тревога и выкатка теперь в одном
  #     прогоне и по одному коммиту.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [check, integration, image]
    runs-on: [self-hosted, setfork-core]
    # `queue: max` — штатный способ не терять прогоны: по умолчанию (`single`) в
    # группе ждёт РОВНО ОДИН, и каждая новая постановка отменяет предыдущего.
    # Пока идёт выкатка, следующий коммит ждёт в очереди — и любой третий выбивал
    # бы его оттуда. docs: workflow-syntax → «Queueing multiple pending runs».
    # (`cancel-in-progress` с ним несовместим — валидация отвергает пару.)
    concurrency:
      group: deploy-prod-core
      queue: max
    permissions:
      contents: read
      # deployments: write — витрина Deployments в сайдбаре; она же служит
      # признаком «эта ревизия уже на проде» для тревоги ниже.
      deployments: write
      issues: write
    env:
      DEPLOY: root@159.195.151.41
      APP_DIR: /root/setfork/src/setfork-core
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      # Очередь порядок завершения не выравнивает: два пуша подряд могут дойти
      # сюда не по порядку, и опоздавший положил бы на прод старый образ. Свою
      # вершину проверяем ДО чекаута; если ушла вперёд — уступаем прогону вершины,
      # он в очереди и, благодаря `queue: max`, не потеряется.
      - name: Прод свеж или его надо обновить?
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha
            // Итог решения — в СВОДКУ прогона, а не только в аннотации. Прогон,
            // где выкатки не было, заканчивается `success` так же, как прогон с
            // выкаткой: в списке они неотличимы, и оператор делает тот же вывод,
            // что оказался неверным 09.08. Сводка отвечает на вопрос «выкачено
            // ли» прямо в UI, не заставляя читать логи. R3 линзы 08.
            const say = (итог, почему) => core.summary
              .addHeading('Выкатка ядра', 3)
              .addTable([
                [{ data: 'Итог', header: true }, { data: 'Причина', header: true }],
                [итог, почему],
              ])
              .write()

            const { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/master' })
            const tip = ref.object.sha
            if (tip !== sha) {
              const почему = `master уже на \`${tip.slice(0, 7)}\`, а это прогон \`${sha.slice(0, 7)}\` — выкатит прогон вершины`
              core.notice(почему)
              await say('⏭️ пропущена', почему)
              core.setOutput('fresh', '')
              return core.setOutput('sha', '')
            }
            // Ревизия уже на проде? Тогда сборка и `compose up` не нужны: это не
            // только время раннера, но и пересоздание контейнера, то есть ядро на
            // секунды пропадает, а запись версий списков идёт только через него.
            // При этом прод СВЕЖ — и тревогу снять надо, поэтому ответа два.
            const { data: deps } = await github.rest.repos.listDeployments({
              ...context.repo, sha, environment: 'production', per_page: 1,
            })
            let live = false
            if (deps.length) {
              const { data: states } = await github.rest.repos.listDeploymentStatuses({
                ...context.repo, deployment_id: deps[0].id, per_page: 1,
              })
              live = states[0]?.state === 'success'
            }
            core.setOutput('fresh', sha)
            if (live) {
              const почему = `\`${sha.slice(0, 7)}\` уже на проде — повторная выкатка не нужна`
              core.notice(почему)
              await say('✅ прод уже свеж', почему)
              return core.setOutput('sha', '')
            }
            await say('🚀 выкатываем', `\`${sha.slice(0, 7)}\` — вершина master, на проде её ещё нет`)
            core.setOutput('sha', sha)

      - uses: actions/checkout@v4
        if: steps.target.outputs.sha != ''
        with:
          persist-credentials: false

      # Витрина Deployments — история выкаток в сайдбаре и признак «уже на проде».
      # Сбой её API не должен ронять доставку, отсюда continue-on-error.
      - name: 'Deployment: старт'
        id: dep
        if: steps.target.outputs.sha != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { data: dep } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'ядро на прод (docker save|load + compose up)',
            })
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: dep.id, state: 'in_progress',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
            core.setOutput('id', String(dep.id))

      - name: Ключ деплоя (ro-mount раннера)
        if: steps.target.outputs.sha != ''
        run: |
          test -f /ssh/setfork || { echo "::error::нет /ssh/setfork — подними раннер из setfork-ci-runner/docker-compose.yml (там ro-mount ключа)"; exit 1; }
          command -v ssh >/dev/null || (apt-get update -qq && apt-get install -y -qq openssh-client)
          install -m 600 /ssh/setfork /tmp/deploy_key

      # Образ уже собран джобой `image` этого же прогона. Раннеры сидят на ОДНОМ
      # docker-демоне хоста (sibling через docker.sock), поэтому тег виден и отсюда —
      # второй сборки не нужно. Если демон почистили между джобами, собираем заново:
      # лучше лишние минуты, чем непрокатка.
      # ⚠️ Тег СВОЙ НА КАЖДУЮ ВЫКАТКУ, а не общий `setfork-core:prod`.
      #
      # `docker compose up` решает, трогать ли контейнер, по конфигурации сервиса,
      # где образ записан ИМЕНЕМ. Подменишь содержимое под тем же именем — compose
      # ответит «Container setfork-core Running» и оставит работать старый образ.
      # Проверено на выкатке 12.08 09:37 (прогон 31583005066): `docker load` тег
      # перевесил, контейнер остался на прежнем образе (он стал висячим), джоба
      # отчиталась success. Сработала эта схема ровно один раз — 08:19, когда имя
      # менялось с `setfork-core-core:latest` на `setfork-core:prod`.
      #
      # У фронта такой беды нет: он собирает образ НА СЕРВЕРЕ (`up -d --build`),
      # то есть compose всегда видит свежий слой. Ядро доставляется потоком
      # `save | load`, поэтому уникальность обязана быть в теге.
      - name: Доставка образа на прод и подъём
        if: steps.target.outputs.sha != ''
        run: |
          SSH="ssh -i /tmp/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new $DEPLOY"
          TAG="setfork-core:$GITHUB_SHA"
          docker image inspect "$IMAGE:$GITHUB_SHA" >/dev/null 2>&1 || {
            echo "::warning::образа $GITHUB_SHA нет в локальном демоне — собираю заново"
            docker build --target runtime -t "$IMAGE:$GITHUB_SHA" .
          }
          docker tag "$IMAGE:$GITHUB_SHA" "$TAG"
          docker save "$TAG" | $SSH docker load
          tar --exclude=.git -czf - . | $SSH "mkdir -p $APP_DIR && tar -xzf - -C $APP_DIR"
          $SSH "printf 'services:\n  core:\n    image: %s\n' '$TAG' > $APP_DIR/docker-compose.image.yml"
          # Без --remove-orphans: на netcup проектом частично управляет Dokploy, и
          # «лишним» compose может счесть чужой контейнер (у фронта это уже учтено).
          $SSH "cd $APP_DIR && docker compose -f docker-compose.dokploy.yml -f docker-compose.image.yml up -d --no-build"

      # Ждём НАСТОЯЩЕЙ готовности, а не фиксированную паузу: у образа есть
      # HEALTHCHECK через grpc_health_probe, и до первой пробы (start-period 10 с)
      # контейнер числится `health: starting`. Прежний `sleep 5` успевал застать
      # либо ещё стартующий контейнер, либо уже упавший и перезапущенный —
      # «ожидание, которое не ожидает», R8 линзы 08.
      - name: Health-check
        if: steps.target.outputs.sha != ''
        run: |
          SSH="ssh -i /tmp/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new $DEPLOY"
          for i in $(seq 1 30); do
            STATE=$($SSH "docker inspect setfork-core --format '{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}'" 2>/dev/null || echo 'нет/контейнера')
            case "$STATE" in
              running/healthy) echo "ядро здорово через $((i * 2)) с"; exit 0 ;;
              running/none)    echo "ядро запущено (healthcheck у образа нет)"; exit 0 ;;
              running/starting) ;;
              *) echo "::notice::состояние $STATE" ;;
            esac
            sleep 2
          done
          echo "::error::ядро не стало здоровым за 60 с (последнее состояние: $STATE)"
          $SSH "docker logs --tail 50 setfork-core" || true
          exit 1

      # Гейт против «успеха при неудаче»: сверяем, что контейнер поднят ИМЕННО на
      # выкаченном образе. Именно отсутствие этой проверки скрывало предыдущий
      # дефект — health-check показывал healthy, потому что живой контейнер и был
      # живым, просто старым.
      - name: Контейнер работает на выкаченном образе?
        if: steps.target.outputs.sha != ''
        run: |
          SSH="ssh -i /tmp/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new $DEPLOY"
          WANT=$($SSH "docker image inspect setfork-core:$GITHUB_SHA --format '{{.Id}}'" 2>/dev/null || echo '')
          LIVE=$($SSH "docker inspect setfork-core --format '{{.Image}}'" 2>/dev/null || echo '')
          if [ -z "$WANT" ] || [ -z "$LIVE" ]; then
            echo "::error::не удалось сверить образы (доставленный='$WANT', живой='$LIVE')"
            exit 1
          fi
          if [ "$WANT" != "$LIVE" ]; then
            echo "::error::контейнер работает на ${LIVE:0:19}, а выкачен ${WANT:0:19} — compose не пересоздал контейнер"
            $SSH "docker ps --filter name=setfork-core --format '{{.Names}} {{.Image}} {{.Status}}'"
            exit 1
          fi
          echo "контейнер на выкаченном образе ${WANT:7:12}"
          # Итог доставки — в сводку прогона: она отвечает «что именно сейчас на
          # проде», не заставляя открывать логи джобы. R3 линзы 08.
          {
            echo "### Доставлено на прод"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Ревизия | \`${GITHUB_SHA:0:7}\` |"
            echo "| Образ | \`${WANT:7:19}\` |"
            echo "| Контейнер | пересоздан и здоров |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Старые образы выкаток копятся на сервере (каждая ~200 МБ). Держим последние
      # три: откатиться на предыдущий можно правкой одной строки в
      # docker-compose.image.yml, а диск не растёт без потолка — на `.ru` кэш сборок
      # уже съедал 15 ГБ из 35.
      - name: Убрать старые образы выкаток
        if: steps.target.outputs.sha != ''
        continue-on-error: true
        run: |
          SSH="ssh -i /tmp/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new $DEPLOY"
          $SSH "docker images 'setfork-core' --format '{{.Tag}} {{.CreatedAt}}' | sort -k2 -r | tail -n +4 | awk '{print \$1}' | xargs -r -I{} docker rmi setfork-core:{}" || true

      # Тревогу снимает подтверждённая свежесть прода, а не факт сборки: шаг идёт
      # по `fresh`, поэтому отрабатывает и когда катить было нечего. Иначе тревога,
      # чьё закрытие однажды сорвалось, не закрылась бы уже никогда.
      - name: Снять тревогу — прод на вершине master
        if: success() && steps.target.outputs.fresh != ''
        uses: actions/github-script@v7
        with:
          script: |
            // Тревогу об отставании заводит prod-stale.yml, поэтому узнаём её по
            // МЕТКЕ: пока идентичностью служил заголовок, он жил в двух файлах и при
            // переименовании молча разъехался — закрыватель перестал её находить, и
            // она висела бы до следующей почасовой проверки.
            // Замечание авто-ревью на fe#787 (P2).
            const LABEL = 'alert:prod-stale'
            try {
              const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', labels: LABEL, per_page: 100 })
              for (const i of open.filter((x) => !x.pull_request)) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: i.number,
                  body: `Ядро выкачено на \`${context.sha.slice(0, 7)}\` — прод снова свежий.`,
                })
                await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: 'closed' })
                core.notice(`тревога #${i.number} закрыта`)
              }
            } catch (e) {
              // Отказ ведёт в сторону ОТКРЫТОЙ тревоги: не сумели снять сигнал —
              // пусть висит, это честнее ложного «всё хорошо». Выкатка уже прошла,
              // поэтому шаг не красим.
              core.warning(`не удалось снять тревогу (${e.message}) — оставлена открытой`)
            }

      # Копию ключа не оставляем на общем раннере (там же гоняется PR-код).
      # См. security-скан 2026-07-23, F3 (CWE-522).
      - name: Очистка ключа деплоя
        if: always()
        run: shred -u /tmp/deploy_key 2>/dev/null || rm -f /tmp/deploy_key

      - name: 'Deployment: итог'
        if: always() && steps.dep.outputs.id
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: Number(process.env.DEP_ID),
              state: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
        env:
          DEP_ID: ${{ steps.dep.outputs.id }}
          JOB_STATUS: ${{ job.status }}

  # Красный CI = выкатки не будет, и это надо отметить — но НЕ тревогой-issue.
  #
  # Тревога отвечает на вопрос «прод отстаёт?», то есть про СОСТОЯНИЕ, и живёт по
  # расписанию в `prod-stale.yml`. Здесь фиксируется СОБЫТИЕ: этот прогон не
  # довёз. Смешение этих двух вопросов в одном триггере дало во фронте сначала
  # шум (тревога на каждом флейке, R6 линзы 08), а потом молчание: порог «дольше
  # шести часов» внутри джобы никогда не пересчитывался без нового пуша
  # (замечание авто-ревью на fe#787).
  stuck:
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      (needs.check.result != 'success' || needs.integration.result != 'success' || needs.image.result != 'success')
    needs: [check, integration, image]
    runs-on: [self-hosted, setfork-core]
    steps:
      - name: Отметить в сводке, что выкатка не состоялась
        uses: actions/github-script@v7
        env:
          R_CHECK: ${{ needs.check.result }}
          R_INTEGRATION: ${{ needs.integration.result }}
          R_IMAGE: ${{ needs.image.result }}
        with:
          script: |
            const failed = ['CHECK', 'INTEGRATION', 'IMAGE']
              .filter((j) => process.env[`R_${j}`] !== 'success')
              .map((j) => j.toLowerCase())
              .join(', ')
            core.notice(`выкатка ядра пропущена: упало ${failed || 'неизвестно'}`)
            await core.summary
              .addHeading('Выкатка ядра не состоялась', 3)
              .addRaw('Упало: **' + (failed || 'неизвестно') + '** на ' + context.sha.slice(0, 7) + '.')
              .addBreak()
              .addRaw('Если ядро на проде так и останется позади, почасовая проверка заведёт тревогу.')
              .write()
