name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # protoc не нужен (build.rs берёт его из protoc-bin-vendored); libgit2 собирается через cc.
      - run: cargo build --verbose
      - run: cargo test --verbose
