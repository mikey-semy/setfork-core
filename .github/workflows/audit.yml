name: Audit

# Аудит зависимостей (RustSec advisory DB): на PR/пуш в master + еженедельно —
# новые CVE в crates всплывают и без изменений кода. rustsec/audit-check падает
# на найденных advisory и аннотирует их в PR.
# Раннер свой (setfork-ci-runner), джобы «raw» — см. пояснение в ci.yml
# (container:/docker-экшены не работают на раннере-в-докере с sibling-демоном).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '23 6 * * 1' # понедельник, еженедельно

jobs:
  cargo-audit:
    runs-on: [self-hosted, setfork-core]
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (rustup)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Лицензии/дубли/источники графа зависимостей (deny.toml). Advisories не
  # дублируем — их закрывает job cargo-audit выше.
  # НЕ cargo-deny-action: это docker-экшен (не работает с sibling-демоном), а его
  # скачивание релиз-бинаря с release-assets.githubusercontent.com из контейнера
  # рвётся сетью (DPI/шейпинг у провайдера). crates.io доступен → собираем сами.
  cargo-deny:
    runs-on: [self-hosted, setfork-core]
    steps:
      - uses: actions/checkout@v4
      - name: toolchain + cargo-deny из crates.io
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential pkg-config
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" install --locked cargo-deny
      - run: cargo deny check licenses bans sources

  # Скан секретов в истории коммитов (git-режим). Образ — с Docker Hub (доступен);
  # рабочая копия заносится через `docker cp` — bind-mount $PWD из sibling-демона
  # монтировал бы пустоту, а релиз-бинарь gitleaks не скачивается (см. выше).
  secrets:
    runs-on: [self-hosted, setfork-core]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (secret scan)
        run: |
          docker rm -f "gl-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
          docker create --name "gl-${GITHUB_RUN_ID}" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --exit-code 1
          docker cp . "gl-${GITHUB_RUN_ID}:/repo"
          docker start -a "gl-${GITHUB_RUN_ID}"
      - name: cleanup
        if: always()
        run: docker rm -f "gl-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
