name: Audit

# Аудит зависимостей (RustSec advisory DB): на PR/пуш в master + еженедельно —
# новые CVE в crates всплывают и без изменений кода. rustsec/audit-check падает
# на найденных advisory и аннотирует их в PR.
# Раннер — свой (setfork-ci-runner): cargo-джобы в container rust:1-trixie,
# gitleaks — на самом раннере (нужен docker.sock).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '23 6 * * 1' # понедельник, еженедельно

jobs:
  cargo-audit:
    runs-on: [self-hosted, setfork-core]
    container: rust:1-trixie
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Лицензии/дубли/источники графа зависимостей (deny.toml). Advisories не
  # дублируем — их закрывает job cargo-audit выше.
  cargo-deny:
    runs-on: [self-hosted, setfork-core]
    container: rust:1-trixie
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  # Скан секретов в истории коммитов (git-режим; не --no-git — тот цепляет токен
  # checkout'а из .git/ в CI). История ядра чиста (проверено локально). Барьер.
  secrets:
    runs-on: [self-hosted, setfork-core]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (secret scan)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --redact --exit-code 1
