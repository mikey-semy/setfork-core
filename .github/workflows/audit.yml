name: Audit

# Аудит зависимостей (RustSec advisory DB): на PR/пуш в master + еженедельно —
# новые CVE в crates всплывают и без изменений кода. rustsec/audit-check падает
# на найденных advisory и аннотирует их в PR. Плюс gitleaks по истории и zizmor
# по самим воркфлоу.
# Раннер свой (setfork-ci-runner), джобы «raw» — см. пояснение в ci.yml
# (container:/docker-экшены не работают на раннере-в-докере с sibling-демоном).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '23 6 * * 1' # понедельник, еженедельно

# Пол для всех джоб: без этой строки GITHUB_TOKEN приезжает с правами по
# умолчанию для репозитория (в том числе на запись). Кому нужно больше —
# объявляет у себя и перекрывает (cargo-audit ниже).
permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: [self-hosted, setfork-core]
    # Экшен создаёт check-run (аннотации в PR) и issue на cron-прогоне; без этих
    # прав падает «Resource not accessible by integration» ПОСЛЕ успешного скана.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      # persist-credentials: false — иначе checkout кладёт GITHUB_TOKEN в
      # .git/config рабочей копии, а раннер общий и переиспользуемый: токен
      # доживает до чужих шагов и уезжает в артефакты. Ни один шаг здесь
      # git-кредами не пользуется. То же в остальных джобах и в ci.yml.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: toolchain (rustup)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Закреплено хешем, а не `@v2`: v2 у rustsec — ВЕТКА, автор двигает её
      # когда захочет, и наш раннер выполнит новый код рядом с docker.sock хоста
      # и ключом выкатки. Обновлять сознательно: сверить диф и подставить хеш.
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Лицензии/дубли/источники графа зависимостей (deny.toml). Advisories не
  # дублируем — их закрывает job cargo-audit выше.
  # НЕ cargo-deny-action: это docker-экшен (не работает с sibling-демоном), а его
  # скачивание релиз-бинаря с release-assets.githubusercontent.com из контейнера
  # рвётся сетью (DPI/шейпинг у провайдера). crates.io доступен → собираем сами.
  cargo-deny:
    runs-on: [self-hosted, setfork-core]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: toolchain + cargo-deny из crates.io
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential pkg-config
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" install --locked cargo-deny
      - run: cargo deny check licenses bans sources

  # Скан секретов в истории коммитов (git-режим). Образ — с Docker Hub (доступен);
  # рабочая копия заносится через `docker cp` — bind-mount $PWD из sibling-демона
  # монтировал бы пустоту, а релиз-бинарь gitleaks не скачивается (см. выше).
  secrets:
    runs-on: [self-hosted, setfork-core]
    steps:
      # Здесь persist-credentials: false особенно к месту: шаг ниже заносит в
      # контейнер gitleaks рабочую копию ЦЕЛИКОМ, вместе с .git — то есть вместе
      # с токеном, если его туда положить.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # ⚠️ Раннер СВОЙ и рабочую копию переиспользует, поэтому в `.git` остаются рефы
      # чужих веток, а `docker cp .` заносит копию ЦЕЛИКОМ. gitleaks обходит ВСЕ рефы —
      # и предложение краснеет находкой в коммите, которого в нём нет.
      #
      # Замер 28.08.2026: в master 166 коммитов, скан обошёл 195. Двадцать девять чужих.
      # Нашла сессия фронта у себя (fe), здесь подтверждено числами, а не по аналогии.
      #
      # Поэтому на предложении сканируется ДИАПАЗОН `база..HEAD`. На пуше в master и по
      # расписанию базы нет — диапазон пуст, скан идёт целиком, как и был.
      #
      # Не удалось достать базу — НЕ СУЖАЕМ: лишняя работа безопаснее пропущенного
      # секрета. Гейт обязан ошибаться в сторону «просканировать больше».
      - name: Диапазон коммитов для скана
        id: range
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "${BASE:-}" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "opts=--log-opts=$BASE..HEAD" >> "$GITHUB_OUTPUT"
            echo "диапазон: $BASE..HEAD ($(git rev-list --count "$BASE..HEAD") коммитов)"
          else
            echo "opts=" >> "$GITHUB_OUTPUT"
            echo "диапазона нет — скан целиком (пуш в master, расписание либо база недоступна)"
          fi

      - name: gitleaks (secret scan)
        env:
          LOG_OPTS: ${{ steps.range.outputs.opts }}
        run: |
          docker rm -f "gl-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
          # Отчёт JSON — чтобы красный НАЗЫВАЛ МЕСТО. Без него gitleaks печатает только
          # «leaks found: 1», и адрес приходится добывать клонированием и повтором скана
          # у себя. Значение остаётся скрытым: `--redact` глушит его и в отчёте.
          docker create --name "gl-${GITHUB_RUN_ID}" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --exit-code 1 \
            --report-format=json --report-path=/tmp/gl.json $LOG_OPTS
          docker cp . "gl-${GITHUB_RUN_ID}:/repo"
          # `if !` намеренно вместо `&& exit`: шаг идёт под `set -e`, и условие if —
          # единственная форма, где неуспех гарантированно НЕ обрывает шаг досрочно.
          if ! docker start -a "gl-${GITHUB_RUN_ID}"; then
            echo "::error::gitleaks нашёл секреты — отчёт ниже (значения скрыты --redact)"
            # Отчёт печатается целиком, без разбора: у JSON внутри YAML внутри shell
            # слишком много слоёв кавычек, и парсер здесь стал бы вторым источником
            # отказов. Полный отчёт даёт правило, файл, строку и коммит.
            docker cp "gl-${GITHUB_RUN_ID}:/tmp/gl.json" /tmp/gl.json 2>/dev/null || true
            if [ -s /tmp/gl.json ]; then cat /tmp/gl.json; else echo "  (отчёт забрать не удалось — смотри вывод выше)"; fi
            exit 1
          fi
      - name: cleanup
        if: always()
        run: docker rm -f "gl-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true

  # Аудит САМИХ воркфлоу (zizmor): инъекция в `run:` через подконтрольные поля
  # события, лишние права GITHUB_TOKEN, токен, осевший в .git/config, экшены на
  # подвижной ссылке. У нас это не абстракция: раннер свой, у него docker.sock
  # ХОСТА и ключ выкатки на прод — цена чужого кода в шаге здесь выше, чем на
  # одноразовой машине GitHub. Правила и политика закрепления — .github/zizmor.yml.
  #
  # Гейт настоящий, не «печатаем и идём дальше»: на момент подключения находок
  # ноль, поэтому красный цвет означает ровно «в воркфлоу завелось новое».
  workflows:
    runs-on: [self-hosted, setfork-core]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Образ с GHCR, а не pip: у раннера python 3.8, а zizmor новее 1.2 требует
      # 3.10+ — pip там молча подсовывает версию годичной давности (проверено
      # прогоном: «Could not find a version that satisfies zizmor==1.29.0»).
      # Релиз-бинарь с GitHub и официальный экшен отпадают по другой причине: они
      # тянут release-assets.githubusercontent.com, которые у нас рвутся DPI.
      #
      # Дальше — тот же приём, что с gitleaks выше: контейнер создаётся, дерево
      # заносится `docker cp` (bind-mount из sibling-демона монтировал бы пустоту),
      # `docker start -a` отдаёт код возврата контейнера — 0 без находок, 11..14
      # с находками, то есть гейт получается без единой строки условий.
      # Заносим ТОЛЬКО .github: остальное дерево и .git аудиту не нужны.
      #
      # Версия образа закреплена: линтер, который сам приносит новые правила,
      # красил бы PR без единой правки воркфлоу. Обновлять сознательно.
      #
      # --offline: без него zizmor ходит в API GitHub за метаданными экшенов —
      # лишняя сетевая зависимость и лимиты на канале, который и так шейпится.
      # --format github: находки приезжают аннотациями к строкам воркфлоу.
      - name: zizmor (аудит воркфлоу)
        run: |
          docker rm -f "zz-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/zz"
          mkdir -p "$RUNNER_TEMP/zz"
          cp -r .github "$RUNNER_TEMP/zz/"
          # Тянем с ЧИСТЫМ docker-конфигом: в конфиге раннера мог остаться
          # протухший логин в ghcr.io от прошлой выкатки, и тогда даже публичный
          # образ отвечает «denied». Логин теперь снимается (ci.yml), но джоба не
          # должна зависеть от порядка прогонов.
          ZZ_CFG=$(mktemp -d)
          DOCKER_CONFIG="$ZZ_CFG" docker pull --quiet ghcr.io/zizmorcore/zizmor:1.29.0 >/dev/null
          rm -rf "$ZZ_CFG"
          docker create --name "zz-${GITHUB_RUN_ID}" ghcr.io/zizmorcore/zizmor:1.29.0 \
            --offline --no-progress --format github --config /repo/.github/zizmor.yml /repo >/dev/null
          docker cp "$RUNNER_TEMP/zz/." "zz-${GITHUB_RUN_ID}:/repo"
          docker start -a "zz-${GITHUB_RUN_ID}"
      - name: cleanup
        if: always()
        run: docker rm -f "zz-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
