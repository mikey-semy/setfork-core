name: Audit

# Аудит зависимостей (RustSec advisory DB): на PR/пуш в master + еженедельно —
# новые CVE в crates всплывают и без изменений кода. rustsec/audit-check падает
# на найденных advisory и аннотирует их в PR.
# Раннер свой (setfork-ci-runner), джобы «raw» — см. пояснение в ci.yml
# (container:/docker-экшены не работают на раннере-в-докере с sibling-демоном).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '23 6 * * 1' # понедельник, еженедельно

jobs:
  cargo-audit:
    runs-on: [self-hosted, setfork-core]
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (rustup)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Лицензии/дубли/источники графа зависимостей (deny.toml). Advisories не
  # дублируем — их закрывает job cargo-audit выше.
  cargo-deny:
    runs-on: [self-hosted, setfork-core]
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  # Скан секретов в истории коммитов (git-режим). Нативный бинарь, не docker:
  # маунт $PWD из sibling-демона монтирует НЕ рабочую копию (см. ci.yml).
  secrets:
    runs-on: [self-hosted, setfork-core]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (secret scan)
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source=. --redact --exit-code 1
