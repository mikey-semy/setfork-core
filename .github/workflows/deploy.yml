# Автодеплой ядра на прод-канон setfork.com (159.195.151.41, netcup) после зелёного CI.
#
# ⚠️ ЦЕЛЬ СМЕНИЛАСЬ 11.08.2026. Канон вернулся на setfork.com 04.08 (ADR-0017), у фронта
# это исправили 09.08 (fe#726) — а у ядра нет. Ядро продолжало ехать на 31.177.83.219, и на
# каноне работало ядро от 07.08 (попало туда один раз при переезде) рядом со свежим фронтом.
# Опасно это не отставанием само по себе: запись версий идёт ТОЛЬКО через ядро, а protobuf
# молча игнорирует незнакомые поля — новые поля шага доехали бы до старого ядра и пропали
# без единой ошибки. Находка линзы 08, R1.
#
# Образ ядра собирается ЗДЕСЬ, на локальном self-hosted раннере, и уезжает на
# сервер потоком `docker save | ssh docker load` — БЕЗ реестра. Причина историческая:
# RF-сервер не мог качать с objects.githubusercontent.com (шейпинг провайдера), а GHCR-pull
# потребовал бы PAT read:packages на сервере. Способ оставлен и для netcup: он не зависит
# ни от кредов на сервере, ни от доступности реестра.
#
# Ключ деплоя приходит ro-mount'ом из setfork-ci-runner/docker-compose.yml
# (/ssh/setfork) — в GitHub Secrets ничего не хранится.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

# Очередь выкатки объявлена НА ДЖОБЕ deploy, а не на воркфлоу. На воркфлоу она
# захватывала бы и прогоны, где деплоя нет вовсе (упавший CI → работает только
# `stuck`): такой прогон занимал бы слот и вытеснял из очереди тот, что должен
# был выкатывать, — GitHub держит один running и один pending, новая постановка
# отменяет прежний pending. Замечание авто-ревью на core#88 (P1).

env:
  DEPLOY: root@159.195.151.41
  APP_DIR: /root/setfork/src/setfork-core

jobs:
  # CI не зелёный → деплоя не будет, и об этом надо СКАЗАТЬ. У фронта такая тревога
  # есть с 09.08 (fe#724), у ядра не было вовсе: пропуск не оставлял следа, а на
  # каноне тем временем работало ядро от 07.08. Находка линзы 08, R7.
  stuck:
    # Провенанс тот же, что у deploy ниже: иначе форк-PR с веткой `master` запускал бы
    # привилегированную джобу и писал в общую тревогу «прод отстал», хотя выкатки и не
    # ожидалось. Находка авто-ревью на core#88.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'master'
    # Метка `setfork-core`, а НЕ `setfork`: раннеры с меткой `setfork` зарегистрированы
    # на репозиторий фронта, в этом их нет ни одного
    # (`gh api repos/mikey-semy/setfork-core/actions/runners` — четыре, все `setfork-core`).
    # Джоба с чужой меткой не падает, а молча висит в очереди до суточного таймаута,
    # то есть тревога о пропущенной выкатке не пришла бы ни разу — ровно тот дефект,
    # против которого она и заводится.
    #
    # Оговорка: если раннеры ядра лежат совсем, тревога тоже не приедет — она дождётся
    # их возвращения в очереди. Отдельного канала на этот случай нет сознательно:
    # GitHub-минуты не тратим (решение владельца), а «CI не гоняется вовсе» видно
    # по пустому списку прогонов.
    runs-on: [self-hosted, setfork-core]
    # Своя очередь, отдельная от выкатки: тревоги сериализуются между собой (две
    # сразу завели бы два issue), но не отбирают слот у деплоя.
    concurrency:
      group: deploy-prod-core-alert
      queue: max
    permissions:
      contents: read
      issues: write
    steps:
      - name: Тревога — выкатка ядра не состоялась
        env:
          GH_TOKEN: ${{ github.token }}
          # Репозиторий задаём явно: джоба не делает checkout, а без него gh определяет
          # его по git-remote рабочего каталога — на чистом раннере такого каталога нет,
          # и команда молча падает вместе с тревогой.
          GH_REPO: ${{ github.repository }}
          TITLE: '🟠 Ядро отстаёт от master: CI не зелёный'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
        run: |
          command -v gh >/dev/null || { echo "::warning::нет gh CLI на раннере — тревога не отправлена"; exit 0; }
          # Опоздавший упавший прогон не должен тревожить, если master уже ушёл вперёд:
          # его ревизия никого не касается, а закрыть такую тревогу было бы некому.
          TIP=$(gh api repos/${{ github.repository }}/commits/master --jq .sha 2>/dev/null || echo '')
          if [ -n "$TIP" ] && [ "$TIP" != "$SHA" ]; then
            echo "::notice::упал прогон ${SHA:0:7}, а master уже на ${TIP:0:7} — тревогу не заводим"
            exit 0
          fi
          BODY="CI ядра на master завершился как \`$RESULT\` на \`${SHA:0:7}\` — выкатка пропущена.

          Прогон: $RUN_URL

          Чем это опасно именно у ядра: запись версий идёт ТОЛЬКО через него, а protobuf молча
          игнорирует незнакомые поля — новые поля шага доедут до старого ядра и пропадут без ошибки.
          Возраст ядра на каноне: \`ssh root@159.195.151.41 \"docker inspect setfork-core --format '{{.Created}}'\"\`.
          Эта тревога закроется сама при следующей зелёной выкатке."
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body "$BODY" || echo "::warning::не удалось дописать в тревогу #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY" || echo "::warning::не удалось создать тревогу"
          fi

  deploy:
    # Деплоим ТОЛЬКО реальный push в наш master, не форк-PR. head_branch
    # подделывается именем форк-ветки (назвал ветку форка `master` — фильтр
    # branches:[master] выше матчится), поэтому дополнительно требуем: событие
    # CI-прогона = push (не pull_request) И прогон из САМОГО репозитория
    # (head_repository == этот репо, не форк). См. security-скан 2026-07-23, F2 (CWE-829).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: [self-hosted, setfork-core]
    # `queue: max` — штатный способ не терять прогоны: по умолчанию (`single`) в
    # группе ждёт РОВНО ОДИН, и каждая новая постановка отменяет предыдущего.
    # Пока идёт выкатка, прогон вершины ждёт в очереди — и любой следующий выбивал
    # бы его оттуда. С `max` очередь держит до 100 и разбирается FIFO.
    # docs.github.com/actions/…/workflow-syntax#queueing-multiple-pending-runs
    # (`cancel-in-progress` с ним несовместим — валидация отвергает пару).
    concurrency:
      group: deploy-prod-core
      queue: max
    # deployments: write — витрина Deployments в сайдбаре GitHub (история выкаток).
    permissions:
      contents: read
      deployments: write
      # issues: write — чтобы шаг снятия тревоги мог закрыть issue. Без него gh молча
      # падает, а `|| true` прячет ошибку: тревога остаётся висеть после успешной
      # выкатки. Находка авто-ревью на core#88.
      issues: write
      # actions: read — шагу «что выкатываем» нужен список прогонов CI по вершине.
      # Явный блок permissions отключает ВСЁ неперечисленное, поэтому без этой строки
      # listWorkflowRunsForRepo отвечает 403 и красит каждую выкатку, где master ушёл
      # вперёд. Замечание авто-ревью на core#88 (P1).
      actions: read
    steps:
      # Что именно выкатываем, решаем ДО чекаута: не «свой» коммит, а вершину master,
      # если её CI уже зелёный. Так делают GitOps-контроллеры (Argo CD, Flux): целью
      # доставки является состояние ветки, а не отдельный прогон.
      #
      # Почему не просто «уступить свежему прогону» (как сейчас у фронта): очередь
      # concurrency держит ОДИН running и ОДИН pending, и каждая новая постановка
      # вытесняет прежний pending
      # (docs.github.com/actions/…/control-workflow-concurrency). Пока идёт выкатка A,
      # прогон вершины B стоит в очереди — и опоздавший прогон старого коммита C
      # выбивает B из слота. C, увидев чужую вершину, уступил бы, а B уже отменён:
      # прод молча остаётся на A до следующего пуша. Ровно тот класс, из-за которого
      # прод не обновлялся трое суток (линза 08). Здесь опоздавший C доставляет
      # вершину B сам, поэтому вытеснение слота ничего не теряет.
      - name: Что выкатываем — свой коммит или ушедшую вперёд вершину
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            // github-script, а НЕ gh: на раннере без GitHub CLI шаг падал бы с кодом 127
            // и валил каждую выкатку. Node и этот action есть всегда.
            const mine = process.env.DEPLOY_SHA
            const { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/master' })
            const tip = ref.object.sha
            if (tip === mine) return core.setOutput('sha', mine)

            // Вершина ушла вперёд. Выкатываем ЕЁ, но только если её CI уже зелёный —
            // непроверенный код на прод не едет.
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              ...context.repo, head_sha: tip, event: 'push', per_page: 20,
            })
            const ci = runs.workflow_runs.find((r) => r.name === 'CI')
            if (ci?.conclusion === 'success') {
              core.notice(`master уже на ${tip.slice(0, 7)} и её CI зелёный — выкатываем вершину вместо ${mine.slice(0, 7)}`)
              return core.setOutput('sha', tip)
            }
            core.notice(`master на ${tip.slice(0, 7)}, её CI — ${ci?.status ?? 'не запускался'}; выкатит её собственный прогон`)
            core.setOutput('sha', '')
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/checkout@v4
        if: steps.target.outputs.sha != ''
        with:
          ref: ${{ steps.target.outputs.sha }}

      # GitHub Deployment — только витрина/история в сайдбаре: сам деплой ниже от
      # него никак не зависит, и сбой API не должен ронять доставку (continue-on-error).
      - name: 'Deployment: старт'
        id: dep
        if: steps.target.outputs.sha != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { data: dep } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: process.env.DEPLOY_SHA,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'ядро на прод (docker save|load + compose up)',
            })
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: dep.id, state: 'in_progress',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
            core.setOutput('id', String(dep.id))
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}

      - name: Ключ деплоя (ro-mount раннера)
        if: steps.target.outputs.sha != ''
        run: |
          test -f /ssh/setfork || { echo "::error::нет /ssh/setfork — подними раннер из setfork-ci-runner/docker-compose.yml (там ro-mount ключа)"; exit 1; }
          command -v ssh >/dev/null || (apt-get update -qq && apt-get install -y -qq openssh-client)
          install -m 600 /ssh/setfork /tmp/deploy_key

      - name: Сборка → доставка образа → up
        if: steps.target.outputs.sha != ''
        run: |
          SSH="ssh -i /tmp/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new $DEPLOY"
          docker build -t setfork-core:prod --target runtime .
          docker save setfork-core:prod | $SSH docker load
          tar --exclude=.git -czf - . | $SSH "mkdir -p $APP_DIR && tar -xzf - -C $APP_DIR"
          $SSH "printf 'services:\n  core:\n    image: setfork-core:prod\n' > $APP_DIR/docker-compose.image.yml"
          # Без --remove-orphans: на netcup проектом частично управляет Dokploy, и
          # «лишним» compose может счесть чужой контейнер (у фронта это уже учтено).
          $SSH "cd $APP_DIR && docker compose -f docker-compose.dokploy.yml -f docker-compose.image.yml up -d --no-build"

      - name: Health-check
        if: steps.target.outputs.sha != ''
        run: |
          SSH="ssh -i /tmp/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new $DEPLOY"
          sleep 5
          $SSH "docker ps --filter name=setfork-core --format '{{.Names}} {{.Status}}' | grep -q 'Up' " || { echo "::error::контейнер ядра не поднялся"; $SSH "docker logs --tail 50 setfork-core"; exit 1; }

      # Зелёная выкатка снимает тревогу сама: иначе она живёт вечно и перестаёт
      # что-либо значить, а следующие сбои дописываются в протухшую. Находка
      # авто-ревью на core#88 — у фронта такой шаг есть с fe#724.
      - name: Снять тревогу — выкатка прошла
        if: success() && steps.target.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: '🟠 Ядро отстаёт от master: CI не зелёный'
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          command -v gh >/dev/null || { echo "::warning::нет gh CLI на раннере — тревога осталась открытой"; exit 0; }
          # Закрываем ВСЕ открытые с этим заголовком, а не первую: тревоги заводятся
          # из разных прогонов, и поиск по заголовку уже возвращал больше одной.
          # Оставленная открытой тревога — это ложный «прод отстаёт» на свежем проде.
          for N in $(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[].number' 2>/dev/null); do
            gh issue close "$N" --comment "Ядро выкачено на \`${SHA:0:7}\` — прод снова свежий." \
              || echo "::warning::не удалось закрыть тревогу #$N"
          done

      # Копию ключа не оставляем на общем раннере (там же гоняется PR-код из ci.yml).
      # Корневой mount /ssh/setfork — забота инфры (setfork-ci-runner), но лишнюю
      # копию в /tmp затираем всегда. См. security-скан 2026-07-23, F3 (CWE-522).
      - name: Очистка ключа деплоя
        if: always()
        run: shred -u /tmp/deploy_key 2>/dev/null || rm -f /tmp/deploy_key

      - name: 'Deployment: итог'
        if: always() && steps.dep.outputs.id
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: Number(process.env.DEP_ID),
              state: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
        env:
          DEP_ID: ${{ steps.dep.outputs.id }}
          JOB_STATUS: ${{ job.status }}
