# ВРЕМЕННЫЙ файл. Проверяет ровно одно: принимает ли наш GitHub ключ
# `concurrency.queue: max` (документирован в workflow-syntax, но новый).
# Если ключ неизвестен — прогон падает как «Invalid workflow file», и это
# видно ДО мержа, а не после, когда сломался бы деплой ядра.
# Удаляется тем же PR, как только проба зелёная.
name: probe-concurrency

on: pull_request

concurrency:
  group: probe-concurrency-${{ github.ref }}
  queue: max

jobs:
  probe:
    runs-on: [self-hosted, setfork-core]
    concurrency:
      group: probe-concurrency-job-${{ github.ref }}
      queue: max
    steps:
      - run: echo "ключ concurrency.queue принят и на воркфлоу, и на джобе"
