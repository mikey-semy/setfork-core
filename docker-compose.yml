# Обычный (локальный) стек git-ядра: Postgres (pgvector) + сам core.
# Запуск: docker compose up --build. gRPC доступен на localhost:50051.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sethub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sethub}
      POSTGRES_DB: ${POSTGRES_DB:-sethub}
    ports:
      - '${DB_PORT:-5439}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sethub} -d ${POSTGRES_DB:-sethub}']
      interval: 5s
      timeout: 5s
      retries: 10

  core:
    build: { context: ., target: runtime }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sethub}:${POSTGRES_PASSWORD:-sethub}@db:5432/${POSTGRES_DB:-sethub}
      SETFORK_CORE_ADDR: 0.0.0.0:50051
      GIT_DATA_DIR: /data/git
      # Локальный стек: токен можно не задавать, но тогда нужен явный опт-аут —
      # ядро без токена стартует ТОЛЬКО с SETFORK_ALLOW_INSECURE=1 (канал без авторизации,
      # только localhost). Для прод-подобного локального прогона задайте SETFORK_CORE_TOKEN.
      SETFORK_CORE_TOKEN: ${SETFORK_CORE_TOKEN:-}
      SETFORK_ALLOW_INSECURE: ${SETFORK_ALLOW_INSECURE:-1}
      # ADR-0015: адрес приложения для вопроса «можно ли писать в этот список».
      # Пусто + ALLOW_INSECURE=1 → гейт не проверяется (локальный dev, громкий warn
      # в логе). Задайте адрес, чтобы гонять локально как в проде.
      SETFORK_APP_URL: ${SETFORK_APP_URL:-}
      # Rate-limit RPC: обычные/тяжёлые методы, запросов в минуту (0 = выкл).
      SETFORK_RPC_RPM: ${SETFORK_RPC_RPM:-600}
      SETFORK_RPC_RPM_HEAVY: ${SETFORK_RPC_RPM_HEAVY:-60}
    ports:
      - '${CORE_PORT:-50051}:50051'
      - '${METRICS_PORT:-9464}:9464' # Prometheus /metrics
    volumes:
      - gitdata:/data/git # персистентные bare-репо (git = источник правды)
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  gitdata:
